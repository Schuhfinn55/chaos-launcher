# Chaos Launcher Website – nginx (wird von website/deploy-server.sh nach /etc/nginx/conf.d/ kopiert)
server {
    listen 80;
    listen [::]:80;
    server_name chaoslauncher.duckdns.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /var/www/chaoslauncher;
    index index.html;

    # Downloads: sauber als Datei ausliefern, Prüfsumme bleibt stabil
    location /download/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
        types { application/octet-stream exe msi jar; }
        default_type application/octet-stream;
    }
    location = /releases.json { add_header Cache-Control "no-cache"; add_header Access-Control-Allow-Origin *; }
    location = /news.json     { add_header Cache-Control "no-cache"; add_header Access-Control-Allow-Origin *; }

    # Cosmetics-API über HTTPS (gleicher Server, Port 8787)
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
