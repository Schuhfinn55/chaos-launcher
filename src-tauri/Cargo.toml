[package]
name = "chaos-launcher"
version = "2.2.0"
description = "Chaos Launcher - der Minecraft-Client-Launcher für ChaoscraftSMP"
authors = ["ChaoscraftSMP"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chaos_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
tokio = { version = "1", features = ["full"] }
sha1 = "0.10"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
hex = "0.4"
zip = "2"
chrono = "0.4"
futures = "0.3"
dirs = "5"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
discord-rich-presence = "0.2"
tiny_http = "0.12"
local-ip-address = "0.6"
igd = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-single-instance = "2.0.0-rc.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Gdi",
] }

[features]
default = []
